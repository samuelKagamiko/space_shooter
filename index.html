<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter</title>
    <style>
        body {
            margin: 0;
            background-color: #0d0d1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <!-- Le canvas où Macroquad va dessiner le jeu -->
    <canvas id="glcanvas" tabindex='1'></canvas>

    <!-- Chargement du module JS avec le chemin absolu du dépôt GitHub Pages -->
    <script type="module">
        // Si votre dépôt s'appelle "space_shooter", l'URL de base inclut "/space_shooter/"
        import init from "/space_shooter/space_shooter.js";
        
        async function run() {
            await init();
        }
        
        run();
    </script>
</body>
</html>
